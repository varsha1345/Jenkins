<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Webpage</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f7f6;">

    <!-- Navigation Bar -->
    <nav style="background-color: #176b55; padding: 18px; color: white;">
        <h2 style="margin: 0;">My Website</h2>
    </nav>

    <!-- Welcome Section -->
    <div style="text-align: center; padding: 80px 20px;">
        <h1 style="color: #176b55;">Welcome to My Website!</h1>

        <p style="font-size: 18px; color: #555;">
            This is my first simple webpage using HTML and inline CSS.
        </p>

        <button style="
            background-color: #176b55;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;">
            Get Started
        </button>
    </div>

    <!-- About Section -->
    <div style="
        background-color: white;
        margin: 20px auto;
        padding: 30px;
        max-width: 600px;
        text-align: center;
        border-radius: 10px;">
        
        <h2 style="color: #176b55;">About Us</h2>

        <p style="color: #555; line-height: 1.6;">
            We create simple and useful websites using modern web technologies.
            This page demonstrates basic HTML elements and inline CSS styling.
        </p>
    </div>

    <!-- Footer -->
    <footer style="
        background-color: #176b55;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 40px;">
        <p style="margin: 0;">&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
